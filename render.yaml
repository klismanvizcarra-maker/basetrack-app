services:
  - type: web
    # Nombre real del servicio en Render (antes figuraba "basetrack-backend")
    name: basetrack-app
    env: node
    region: frankfurt
    # La base SQLite necesita un disco persistente, que no existe en el plan free
    plan: starter
    rootDir: server
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    disk:
      name: basetrack-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # Base de datos y respaldos dentro del disco persistente
      - key: DB_PATH
        value: /var/data/basetrack.db
      # Secreto de firma JWT: Render lo genera una vez al crear el servicio desde el Blueprint.
      # Si el servicio ya existía, defínalo manualmente en Dashboard → Environment.
      - key: JWT_SECRET
        generateValue: true

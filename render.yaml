services:
  - type: web
    name: basetrack-backend
    env: node
    rootDir: server
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # Secreto de firma JWT: Render lo genera una vez al crear el servicio desde el Blueprint.
      # Si el servicio ya existía, defínalo manualmente en Dashboard → Environment.
      - key: JWT_SECRET
        generateValue: true

name: BASETRACK CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify:
    name: Suite de Verificación (Backend Tests & Build Angular)
    runs-on: ubuntu-latest

    steps:
      - name: Descargar Código Fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalar Dependencias del Frontend
        run: npm install

      - name: Instalar Dependencias del Backend
        run: npm run backend:install

      - name: Ejecutar Protocolo de Verificación Unificado (verify)
        run: npm run verify
        env:
          NODE_ENV: test
          TZ: America/Lima
          JWT_SECRET: ci_test_secret_key_basetrack_2026

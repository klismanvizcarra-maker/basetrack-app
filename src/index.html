  <!-- Favicon & PWA Icons (Versioned to break stale browser and desktop icon cache) -->

  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png?v=20260926">

  <meta name="apple-mobile-web-app-capable" content="yes">

  <!-- Native Mobile Anti-Zoom & Touch Gesture Lockdown -->
  <script>
    // Block iOS Safari gesture zooming
    document.addEventListener('gesturestart', function(e) { e.preventDefault(); }, { passive: false });
    document.addEventListener('gesturechange', function(e) { e.preventDefault(); }, { passive: false });
    document.addEventListener('gestureend', function(e) { e.preventDefault(); }, { passive: false });

    // Block multi-touch pinch zooming
    document.addEventListener('touchmove', function(e) {
      if (e.touches && e.touches.length > 1) {
        e.preventDefault();
      }
    }, { passive: false });

    // Block double-tap to zoom on mobile browsers
    var lastTouchEnd = 0;
    document.addEventListener('touchend', function(e) {
      var now = Date.now();
      if (now - lastTouchEnd <= 300) {
        // Only prevent default on non-interactive elements to allow button taps
        if (!['INPUT', 'SELECT', 'TEXTAREA', 'BUTTON', 'A'].includes(e.target.tagName)) {
          e.preventDefault();
        }
      }
      lastTouchEnd = now;
    }, { passive: false });
  </script>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
</head>
<body>
  <app-root></app-root>

  <!-- PWA Service Worker Registration & Immediate Brand Update -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then((reg) => {
            console.log('[PWA] Service Worker activo en:', reg.scope);
            // Proactively check for new shell assets and icons
            reg.update();
          })
          .catch((err) => console.warn('[PWA] No se pudo registrar Service Worker:', err));
      });
    }
  </script>
</body>
</html>

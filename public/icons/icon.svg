<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#031795" />
      <stop offset="100%" stop-color="#020f5c" />
    </linearGradient>
    <filter id="subtleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#020f5c" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="480" height="480" x="16" y="16" rx="112" fill="none" stroke="#60a5fa" stroke-width="3" stroke-opacity="0.25" />

  <!-- White Core Badge -->
  <circle cx="256" cy="256" r="160" fill="#ffffff" filter="url(#subtleShadow)" />

  <!-- Mining Mountain Peaks -->
  <path d="M160 330 L230 220 L270 270 L300 230 L360 330 Z" fill="#031795" />
  
  <!-- Ascent Growth Arrow (Orange) -->
  <path d="M235 240 L310 150 M310 150 L270 150 M310 150 L310 190" stroke="#d46424" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- Pickaxe Tool Cross -->
  <path d="M185 180 C210 160, 270 160, 315 190" stroke="#0f2b5c" stroke-width="12" stroke-linecap="round" fill="none" />
  <line x1="250" y1="175" x2="210" y2="300" stroke="#d46424" stroke-width="10" stroke-linecap="round" />
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.1" />
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#047857" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="480" height="480" x="16" y="16" rx="112" fill="none" stroke="#a7f3d0" stroke-width="4" stroke-opacity="0.3" />

  <!-- Industrial Target & Orbit Mark -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#ffffff" stroke-width="24" stroke-opacity="0.9" filter="url(#dropShadow)" />
  <circle cx="256" cy="256" r="110" fill="none" stroke="#a7f3d0" stroke-width="16" stroke-dasharray="24 16" stroke-opacity="0.75" />
  <circle cx="256" cy="256" r="50" fill="#ffffff" filter="url(#dropShadow)" />
  <circle cx="256" cy="256" r="24" fill="#059669" />

  <!-- Crosshairs -->
  <line x1="256" y1="56" x2="256" y2="120" stroke="#ffffff" stroke-width="16" stroke-linecap="round" />
  <line x1="256" y1="392" x2="256" y2="456" stroke="#ffffff" stroke-width="16" stroke-linecap="round" />
  <line x1="56" y1="256" x2="120" y2="256" stroke="#ffffff" stroke-width="16" stroke-linecap="round" />
  <line x1="392" y1="256" x2="456" y2="256" stroke="#ffffff" stroke-width="16" stroke-linecap="round" />
</svg>
